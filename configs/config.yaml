# Model configuration
model:
  name: "google/vit-base-patch16-224"
  num_classes: 6
  freeze_backbone: true

# Training parameters
training:
  batch_size: 32
  num_epochs: 15
  learning_rate: 5.0e-05
  weight_decay: 0.01
  scheduler_patience: 3
  scheduler_factor: 0.1
  early_stopping_patience: 7
  early_stopping_delta: 0.005
  mixup_alpha: 0.2
  use_mixup: true
  memory_clear_frequency: 1000
  debug_memory: false

# Data configuration
data:
  image_size: 224
  train_dir: "data/train"
  val_dir: "data/validation"
  test_dir: "data/test"
  train_csv: "data/train/train.csv"
  validation_csv: "data/validation/validation.csv"
  test_csv: "data/test/test.csv"

# Data loading
data_loading:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true

# Paths configuration
paths:
  main_checkpoint_dir: "models/checkpoints"
  main_best_model_path: "models/best_model.pth"
  sensitivity_analysis_dir: "models/sensitivity_results_final"

# General settings
seed: 42
